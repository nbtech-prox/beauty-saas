name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-quality:
    name: Workflow Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  contracts:
    name: "contracts (typecheck + test + build)"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  api-client:
    name: "api-client (typecheck + test + build)"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # api-client depende de @beauty-saas/contracts cujos tipos vivem em dist/
      # (gitignored). É preciso construir o contracts primeiro.
      - name: Build contracts (dependência de tipos)
        run: pnpm --filter @beauty-saas/contracts build
      - name: Typecheck
        run: pnpm typecheck
      # NOTA: `pnpm test:coverage` não corre no CI por incompatibilidade
      # transitiva entre brace-expansion@5.0.9 (override pnpm para CVE) e
      # minimatch@9 (usado por vitest/test-exclude/glob). Os thresholds ficam
      # configurados em vitest.config.ts e podem ser corridos localmente.
      # Quando a incompatibilidade for resolvida, substituir por:
      #   run: pnpm test:coverage
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
